name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Läuft auf dem eigenen Server (self-hosted Runner mit Label "bmwdrift")
    runs-on: [self-hosted, bmwdrift]
    steps:
      - name: Code holen
        # ohne externe Action, nur git
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q --force FETCH_HEAD
          git clean -qffdx
          git remote remove origin

      - name: Image bauen und Container neu starten
        # Der ngrok-Token liegt nur auf dem Server in ~/bmwdrift/.env, nicht im Repo
        run: docker compose -p bmwdrift --env-file "$HOME/bmwdrift/.env" up -d --build --remove-orphans

      - name: Warten bis der Server antwortet
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8046/; then echo "Server läuft"; exit 0; fi
            sleep 2
          done
          echo "Server antwortet nicht"; docker logs --tail 50 bmwdrift; exit 1

      - name: Alte Images aufräumen
        if: always()
        run: docker image prune -f
