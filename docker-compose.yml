services:
  bmwdrift:
    build: .
    image: bmwdrift:latest
    container_name: bmwdrift
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${NGROK_DOMAIN:-pacifist-romp-concrete.ngrok-free.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}   # steht nur in ~/bmwdrift/.env auf dem Server
    ports:
      - "8046:8046"   # im LAN / Tailscale direkt erreichbar
    volumes:
      - bmwdrift-data:/app/data   # geprüfte Rekorde (records.json) überleben Neustarts und Deploys

  ngrok:
    image: ngrok/ngrok:latest
    container_name: bmwdrift-ngrok
    restart: unless-stopped
    depends_on:
      - bmwdrift
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN fehlt (siehe ~/bmwdrift/.env auf dem Server)}
    command: http --url=${NGROK_DOMAIN:-pacifist-romp-concrete.ngrok-free.dev} bmwdrift:8046

volumes:
  bmwdrift-data:
